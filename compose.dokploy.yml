name: fleetmate

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MEDIA_DIR: ${MEDIA_DIR}
    volumes:
      - media:/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  vision-service:
    build:
      context: ./ai/vision-service
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL}
      MEDIA_DIR: ${MEDIA_DIR}
    volumes:
      - media:/media
    ports:
      - "8001:8001"
    depends_on:
      - api

  packing-service:
    build:
      context: ./ai/packing-service
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  app:
    build:
      context: ./app
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL}
      VITE_VISION_BASE_URL: ${VISION_BASE_URL}
      VITE_PACKING_BASE_URL: ${PACKING_BASE_URL}
    volumes:
      - media:/app/public/media
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  media: